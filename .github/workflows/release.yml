name: release

# Push a version tag (e.g. v0.5.0) to release automatically:
#   1) create-release — draft release + auto-generated release notes (変更点)
#   2) build          — installers for every OS attach to that release,
#                       together with signed updater artifacts + latest.json
#   3) publish        — once ALL builds succeed the release goes live, so the
#                       in-app updater (releases/latest/download/latest.json)
#                       resolves it immediately. If any build fails the
#                       release stays a draft and nothing is published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release with generated notes
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Tag from the push; on a manual run, derive it from tauri.conf.json.
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : 'v' + JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
            // 変更点（前リリースからのコミット/PR一覧）を自動生成する。
            const notes = await github.rest.repos.generateReleaseNotes({
              owner, repo,
              tag_name: tag,
              target_commitish: context.sha,
            });
            const release = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `TimeTracker ${tag}`,
              body: [
                '自動ビルドされたインストーラです。Windows は NSIS (.exe)、macOS は .dmg、Linux は AppImage/.deb。',
                '',
                notes.data.body,
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return release.data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04 # AppImage only (no deb/rpm — keeps assets lean)
            args: "--bundles appimage"
          - platform: windows-latest # NSIS installer (.exe)
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            file \
            libxdo-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for signed auto-updates. Set these as repository secrets:
          #   TAURI_SIGNING_PRIVATE_KEY          -> contents of ~/.tauri/timetracker.key
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD -> the key password (empty here)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the release (all installers attached)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
