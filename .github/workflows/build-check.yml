name: build-check

# Native build validation that CANNOT run in the WSL2 dev environment
# (no webkit2gtk): compiles the Rust backend and bundles the app on the real
# target OSes for every push to a release branch / PR. Does NOT create a
# release — it only proves the app compiles and packages.
on:
  push:
    branches:
      - "release/**"
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # the primary target (NSIS .exe)
            args: "--bundles nsis"
          - platform: ubuntu-22.04 # AppImage only (matches release.yml)
            args: "--bundles appimage"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            file \
            libxdo-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run timer core tests
        run: npm test

      # Build (compile + bundle) without creating a release. Signing keys are
      # provided so the updater artifacts (createUpdaterArtifacts) sign exactly
      # as they will at release time.
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: timetracker-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
          retention-days: 7
